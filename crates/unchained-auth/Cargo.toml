[package]
name = "unchained-auth"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
server-browser-api = { path = "../server-browser-api" }
base64 = "0.22"
jsonwebtoken = "9.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
