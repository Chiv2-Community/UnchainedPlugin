[package]
name = "unchained-auth"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
server-browser-models = { git = "https://github.com/Chiv2-Community/C2ServerBrowserBackend.git", rev = "8df4820dc457fd6ae714e5efe6ad4c9beb15ab1f" }
base64 = "0.22"
jsonwebtoken = "9.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
