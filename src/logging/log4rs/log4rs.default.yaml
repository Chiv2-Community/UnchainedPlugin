appenders:
  console:
    kind: console
    filters:
      - kind: threshold
        level: debug
    encoder:
      kind: palette
      pattern: "{palette({l})}[{d(%H:%M:%S)} {l:5}]{palette({l}_body)} [{sm:<-24.24}] {m}{n}"
      palette:
        error: "#f28b82"
        warn: "#f2cc78"
        info: "#8cb4e1"
        debug: "#808080"
        trace: "#5c5c5c"
        error_body: "#eeeeee"
        warn_body: "#eeeeee"
        info_body: "#eeeeee"
        debug_body: "#808080"
        trace_body: "#5c5c5c"
        title: "#ffff00"
        subtitle: "#ff0000"
  file:
    kind: file
    path: "__UNCHAINED_LOG_PATH__"
    encoder:
      pattern: "[{d(%Y-%m-%d %H:%M:%S)} {P} {l:5}| {M}] {m}{n}"
  kismet:
    kind: file
    path: "__KISMET_LOG_PATH__"
    encoder:
      pattern: "[{d(%Y-%m-%d %H:%M:%S)} {P} {l:5}| {M} ] {m}{n}"

loggers:
  serenity:
    level: warn
  tracing:
    level: warn
  patternsleuth:
    level: warn
  "h2::codec":
    level: warn
  "hyper_util::client":
    level: warn
  "reqwest::connect":
    level: warn

root:
  level: debug
  appenders:
    - console
    - file
