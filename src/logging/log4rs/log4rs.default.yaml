appenders:
  console:
    kind: console
    filters:
      - kind: threshold
        level: debug
    encoder:
      kind: palette
      pattern: "{palette(timestamp)}{d(%H:%M:%S%.3f)}{palette(trace)} | {palette({l})}{l:>5}{palette(trace)} | {palette(module)}{fn}{palette(timestamp)} - {palette({l}_body)}{m}{n}"
      palette:
        error: "#f28b82"
        warn: "#f2cc78"
        info: "#8cb4e1"
        debug: "#808080"
        trace: "#5c5c5c"
        error_body: "#eeeeee"
        warn_body: "#eeeeee"
        info_body: "#eeeeee"
        debug_body: "#808080"
        trace_body: "#5c5c5c"
        timestamp: "#909090"
        module: "#BE9D5C"
        title: {foreground: "#D09128", background: "#2F2F2F"}
        subtitle: {foreground: "#D09128", background: "#2F2F2F"}
  file:
    kind: file
    path: "__UNCHAINED_LOG_PATH__"
    encoder:
      pattern: "[{d(%Y-%m-%d %H:%M:%S)} {P} {l:>5}| {fn}] {m}{n}"
  kismet:
    kind: file
    path: "__KISMET_LOG_PATH__"
    encoder:
      pattern: "[{d(%Y-%m-%d %H:%M:%S)} {P} {l:>5}| {fn}] {m}{n}"

loggers:
  serenity:
    level: warn
  tracing:
    level: warn
  patternsleuth:
    level: warn
  "h2::codec":
    level: warn
  "hyper_util::client":
    level: warn
  "reqwest::connect":
    level: warn

root:
  level: debug
  appenders:
    - console
    - file
