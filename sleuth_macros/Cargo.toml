[package]
name = "sleuth_macros"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
anyhow = "1"
object = "0.32.2"
patternsleuth = { workspace = true }
unchained-macros = { path = "../unchained-macros" }
