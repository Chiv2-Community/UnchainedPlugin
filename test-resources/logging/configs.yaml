inline-palette:
  appenders:
    console:
      kind: console
      encoder:
        kind: palette
        pattern: '{m}{n}'
        palette: {accent: '#123456', first: '#abcdef', second: '#fedcba'}
    file:
      kind: file
      path: null
      encoder: {kind: json}
  root:
    level: info
    appenders: [console, file]
console:
  appenders:
    console:
      kind: console
      encoder: {kind: palette}
  root:
    level: info
    appenders: [console]
rolling-policy:
  kind: compound
  trigger: {kind: size, limit: 1048576}
  roller: {kind: delete}
file-pattern:
  appenders:
    file:
      kind: file
      path: null
      append: false
      encoder: {pattern: ''}
  root:
    level: info
    appenders: [file]
palette-index:
  appenders:
    test:
      kind: console
      encoder:
        kind: palette
        pattern: '{m}'
        palette: {__test_palette_present: null}
  root:
    level: off
    appenders: [test]
non-palette-index:
  appenders:
    test:
      kind: console
      encoder: {kind: pattern}
  root:
    level: off
    appenders: [test]
