[package]
name = "unchained-macros-patternsleuth-impl"
version = "0.1.0"
edition = "2021"
build = "../../build/macro-format.rs"

[build-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
test-case = { workspace = true }
