[package]
name = "UnchainedPlugin"
version = "1.0.0-RC3"
edition = "2021"

[workspace]
members = [".", "sleuth_macros", "xtask", "crates/unchained-auth", "crates/server-browser-api", "crates/unchained-backend"]

[[bin]]
name = "mock_server"
path = "src/bin/mock_server.rs"

[lib]
name = "UnchainedPlugin"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.x86_64-pc-windows-msvc]

[profile.dev]
debug = "full"
opt-level = 0
panic = "unwind"
incremental = false

[profile.release]
debug = "full"
opt-level = 1
panic = "unwind"
lto = false



[build-dependencies]
winres = "0.1"

[lints.rust]
non_snake_case = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rust_analyzer)'] }

[features]
default = [
        "serde-resolvers",
        "dev",
        # "loose_assets",
        "verbose_hooks",
        "cli_commands",
        "rcon_commands",
        "server_registration",
        "mod_management",
        "discord_integration",
        # "request_dummy_hooks",
        "syslog-client",
        # "config_overrides_verbose_hooks",
        # "map_profiles",
        ]
serde-resolvers = []
image-elf = []
dev = []
syslog-client = [  ]
request_dummy_hooks = [] # Enable Get*Post dummy hooks
kismet_log = [] # Dump kismetexecutionmessage logs
with_pdb = ["pdb"]
loose_assets = [] # Load assets in addition to paks
verbose_hooks = [] # print (some) hook triggers to console
config_overrides_verbose_hooks = [] # print (config_override) hook triggers to console
map_profiles = [] # ini-overrides: replace the map-indices layer with map-profiles looked up from unchained.yaml
cli_commands = [] # process commands from plugin windows
rcon_commands = [] # process commands from rcon
server_registration = ["a2s", "reqwest", "get_if_addrs"] # register server with backend
mod_management = [] # info about mod markers and actors
discord_integration = [ "tokio", "crossbeam-channel", "serenity", "discord-http" ]
move-autonomous-desync = []
loading_screen_texture_fallback = [] # GetDataForMap: if no config is injected/found, patch only the texture FName


[dependencies]
unchained-backend = { path = "crates/unchained-backend" }
# patternsleuth = { git = "https://github.com/trumank/patternsleuth.git", rev = "5786164", features = ["process-internal", "serde-resolvers", "image-pe"] }
patternsleuth = { git = "https://github.com/Knutschbert/patternsleuth.git", rev = "644f980", features = ["process-internal", "serde-resolvers", "image-pe"] }
anyhow = "1.0.79"
# Pak index reads for off-thread mod-map discovery. The crates.io `repak`
# crate is an unrelated name-squatter; use trumank/repak.
repak = { git = "https://github.com/trumank/repak" }
# AES-256 key pass-through for paks with encrypted indexes (must unify with
# repak's own aes version).
aes = "0.8"
base64 = "0.22"
hex = "0.4"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
serde_yaml = "0.9"
serde_urlencoded = "0.7"
tracing = "0.1.40"
futures = "0.3.31"
once_cell = "1.19"
paste = "1.0"
memmap2 = "0.9.4"
widestring = "1.0.2"
bitflags = "2.4.1"
log = { version = "0.4", features = ["kv"] }
log4rs = { version = "1.4.0", features = ["log_kv", "json_encoder", "gzip"] }
parking_lot = "0.12.1"
inventory = "0.3.14"
regex = "1.11"
ureq = "3.1.4"
itertools = "0.14.0"
# server registration
a2s = { git = "https://github.com/Knutschbert/a2s-rs.git", rev = "0376331", optional = true }
reqwest = { version = "0.12.19", optional = true, features = ["blocking", "json"]  }
get_if_addrs = { version = "0.5", optional = true }
# discord<
async-trait = "0.1"
notify = "6.1.1"
# pdb loading (local tests)
pdb = { version = "0.8.0", optional = true }
retour = { version = "=0.4.0-alpha.4", features = ["static-detour"]}
clap = { version = "4.5.0", features = ["derive"] } # cli arg parsing
winapi = { version = "0.3.9", features = ["winnt", "wincrypt", "winuser", "excpt"] }
windows = { version = "0.52.0", features = ["Win32_Foundation",
            "Win32_System_Console", 
            "Win32_System_Registry",
            "Win32_System_LibraryLoader", 
            "Win32_System_SystemServices",
            "Win32_Graphics_Gdi", 
            "Win32_Graphics_Direct3D", 
            "Win32_Graphics_Direct3D11",
            "Win32_Graphics_Dxgi", 
            "Win32_Graphics_Dxgi_Common",
            "Win32_UI_WindowsAndMessaging",
            "Win32_System_Threading",
            "Win32_System_Diagnostics_Debug",

            "Win32_Security",
            "Win32_System_Kernel",
            "Win32_System_Memory",
            "Win32_System_ProcessStatus",
            ]}
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time"], optional = true }
serenity = { version = "0.12", optional = true, default-features = false, features = ["client", "gateway", "model", "native_tls_backend"] }
discord-http = { package = "reqwest", version = "0.13", optional = true, default-features = false, features = ["native-tls"] }
shlex = "1.3.0"
crossbeam-channel = { version = "0.5", optional = true}
rand = "0.9.2"
censor = "0.3.0"
crc32c = "0.6.8"
strum = { version = "0.26", features = ["derive"] }
emojis = "0.6"
unicode-segmentation = "1.12"

[dev-dependencies]
test-case = "3.3"
tokio = { version = "1.0", features = ["test-util"] }
[patch.crates-io]
# Pinned fork commit for the trampoline/Box64/Wine fixes used by this project.
# retour = { path = "vendor/retour" }
retour = { git = "https://github.com/Chiv2-Community/retour-rs", rev = "61e6cb966c040ace5e5f4ab9964cdae60f7ce0e1" }
