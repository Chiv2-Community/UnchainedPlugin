[package]
name = "plugin-backend-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false
build = "../../build/build.rs"

[build-dependencies]
unchained-build-plan.workspace = true

# Test-only harness: no adapter library and no runtime consumers.
[[test]]
name = "cli_args"
path = "cli_args.rs"

[[test]]
name = "a2s_transport"
path = "a2s_transport.rs"

[[test]]
name = "backend_transport"
path = "backend_transport.rs"
required-features = ["server_registration"]

[[test]]
name = "registration_metadata"
path = "registration_metadata.rs"

[[test]]
name = "backend_integration"
path = "backend_integration.rs"
required-features = ["container-tests", "server_registration"]

[features]
default = ["server_registration"]
server_registration = []
container-tests = ["dep:testcontainers"]
# Exercise the CLI field enabled by the corresponding plugin feature.
move-autonomous-desync = []

[dependencies]
testcontainers = { workspace = true, optional = true }

[dev-dependencies]
clap = { workspace = true }
censor = { workspace = true }
serde = { workspace = true }
backon = { workspace = true }
test-case = { workspace = true }
a2s = { workspace = true }
server-browser-client = { workspace = true }
server-browser-client-sdk = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["net", "test-util"] }
tokio-util = { workspace = true }
