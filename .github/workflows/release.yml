name: Restore v0.5.0 release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-release-v0.5.0
  cancel-in-progress: false

jobs:
  restore:
    runs-on: windows-2022
    env:
      TAG: v0.5.0
      EXPECTED_SHA: 3b0e0356a98cb73ebd1a0028b20878821e1d821d
      RUSTUP_TOOLCHAIN: nightly-2025-06-19
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Chiv2-Community/UnchainedPlugin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b0e0356a98cb73ebd1a0028b20878821e1d821d
          fetch-depth: 0
          submodules: recursive

      - name: Verify historical source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          # This tag survived in the pre-recreation local checkout.
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$EXPECTED_SHA"
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2025-06-19

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install compatible CMake
        run: python -m pip install cmake==3.31.6

      - name: Test historical Rust helper
        working-directory: sleuth
        run: cargo test --release --locked

      - name: Build locked Rust helper
        working-directory: sleuth
        run: cargo build --release --locked

      - name: Configure original CMake release
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER=cl -T v143 -DCMAKE_BUILD_TYPE=Release -DVERSION="0.5.0"

      - name: Build original CMake release
        run: cmake --build build --config Release

      - name: Verify dependency lock and record provenance
        shell: bash
        run: |
          git diff --exit-code -- sleuth/Cargo.lock
          gh api 'repos/Chiv2-Community/C2ModRegistry/contents/dll_db/packages/Chiv2-Community/UnchainedPlugin.json?ref=770ba5162a0f980d601ec7ceb1782b3978a5a69e' --jq .content | base64 --decode > registry-original.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = next(r for r in json.loads(Path('registry-original.json').read_text())['releases'] if r['tag'] == os.environ['TAG'])
          dll = Path('build/Output/Release/UnchainedPlugin.dll')
          digest = hashlib.sha256(dll.read_bytes()).hexdigest()
          provenance = (
              '\n\n## Restored release\n\n'
              'The repository was deleted and recreated to disassociate it from the old '
              '`nihilianth/UnchainedPlugin` fork, so this release and its original tag had to be restored. '
              'Build-environment differences change the DLL hash.\n\n'
              f"- Original source: `{os.environ['EXPECTED_SHA']}`; no source changes.\n"
              '- Build: Windows 2022, Visual Studio 2022, CMake 3.31.6, nightly-2025-06-19; Cargo dependency lock unchanged.\n'
              f'- SHA-256: `{digest}`.\n'
              f'- Size: `{dll.stat().st_size}` bytes.\n'
          )
          Path('release-notes.md').write_text(release['release_notes_markdown'] + provenance, encoding='utf-8')
          Path('release-provenance.json').write_text(json.dumps({'tag': os.environ['TAG'], 'source_sha': os.environ['EXPECTED_SHA'], 'toolchain': os.environ['RUSTUP_TOOLCHAIN'], 'sha256': digest, 'size': dll.stat().st_size}, indent=2))
          PY
          cat release-provenance.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: restored-v0.5.0
          path: |
            build/Output/Release/UnchainedPlugin.dll
            release-provenance.json
            release-notes.md

      - name: Restore tag and publish without replacing assets or changing latest
        shell: bash
        run: |
          gh api "repos/$GH_REPO/releases/tags/$TAG" > existing-release.json 2> release-query-error.txt && { echo 'Release already exists; refusing to replace it.' >&2; exit 1; }
          grep -q 'HTTP 404' release-query-error.txt
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > existing-tag.json 2> tag-query-error.txt; then
            test "$(python -c 'import json;print(json.load(open("existing-tag.json"))["object"]["sha"])')" = "$EXPECTED_SHA"
          else
            grep -q 'HTTP 404' tag-query-error.txt
            # GITHUB_TOKEN avoids triggering the obsolete tag-push workflow.
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$EXPECTED_SHA"
          fi
          gh release create "$TAG" build/Output/Release/UnchainedPlugin.dll --verify-tag --latest=false --title "UnchainedPlugin $TAG" --notes-file release-notes.md
