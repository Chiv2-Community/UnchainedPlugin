name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Chiv2-Community/zero-infra-mod-registry/actions/validate-metadata@40bbc32f36bd8b1e1a5cebd18b9e5037402bf01f
        with:
          plugin_file: plugin.json

  build:
    needs: validate-plugin
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-Release

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # Extract version from tag (remove 'v' prefix)
      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      # Check if version in Cargo.toml matches the tag
      - name: Verify version matches tag
        shell: bash
        env:
          TAG_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          CARGO_VERSION=$(grep -m 1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Cargo.toml version ($CARGO_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

      # Run tests
      - name: Test
        run: cargo test --release

      # Build the project
      - name: Build
        run: cargo build --release

      # Create GitHub Release
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: UnchainedPlugin v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: target/release/UnchainedPlugin.dll
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  request-registry-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: registry-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Submit DLL release request
        uses: Chiv2-Community/zero-infra-mod-registry/actions/automated-publish@40bbc32f36bd8b1e1a5cebd18b9e5037402bf01f
        with:
          endpoint: https://registry.polehammer.net/registrations
          kind: plugin
          asset_name: UnchainedPlugin.dll
