name: Rust CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: -D warnings
          build-warnings: ''
      - name: Test backend transport and container integration
        run: cargo test --locked -p plugin-backend-integration-tests --features container-tests

  validate-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Chiv2-Community/zero-infra-mod-registry/actions/validate-metadata@v1
        with:
          plugin_file: plugin.json

  build:
    runs-on: windows-2022
    strategy:
      matrix:
        build_type: [debug, release]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          # Preserve v1's compiler warning policy without denying Cargo manifest warnings.
          rustflags: -D warnings
          build-warnings: ''

      # v2.9.3 supports the pinned nightly's Cargo V2 build-directory layout.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          # Separate profiles, including fallback restores; share release builds with release.yml.
          # The Rust cache also keys on the toolchain, environment, and dependencies.
          shared-key: windows-${{ matrix.build_type }}

      # Build the project
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.build_type }}" == "release" ]; then
            cargo build --locked --release
          else
            cargo build --locked
          fi

      # Run tests
      - name: Test
        shell: bash
        run: |
          if [ "${{ matrix.build_type }}" == "release" ]; then
            cargo test --locked --release
          else
            cargo test --locked
          fi

      # Upload artifacts after build and tests succeed
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UnchainedPlugin-${{matrix.build_type}}
          path: |
            target/${{ matrix.build_type }}/UnchainedPlugin.dll
          if-no-files-found: error
