name: Rust CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Chiv2-Community/zero-infra-mod-registry/actions/validate-metadata@d6938174c2efe44d2c105fc3bef5d469fb1d620f # v1.2.2
        with:
          plugin_file: plugin.json

  build:
    runs-on: windows-2022
    strategy:
      matrix:
        build_type: [debug, release]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          # Preserve v1's compiler warning policy without denying Cargo manifest warnings.
          rustflags: -D warnings
          build-warnings: ''

      # v2.9.3 supports the pinned nightly's Cargo V2 build-directory layout.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          # Separate profiles, including fallback restores; share release builds with release.yml.
          # The Rust cache also keys on the toolchain, environment, and dependencies.
          shared-key: windows-${{ matrix.build_type }}

      - name: Inspect restored build outputs
        shell: pwsh
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          $profile = Join-Path target $env:BUILD_TYPE
          foreach ($directory in @('deps', '.fingerprint', 'build')) {
            $path = Join-Path $profile $directory
            if (Test-Path $path) {
              $files = @(Get-ChildItem $path -Recurse -File)
              $bytes = ($files | Measure-Object Length -Sum).Sum
              Write-Output "${path}: $($files.Count) files, ${bytes} bytes"
              Get-ChildItem $path -Filter '*proc*macro2*' | Select-Object Name, LastWriteTime
            } else {
              Write-Output "${path}: missing"
            }
          }

      # Build the project
      - name: Build
        shell: bash
        env:
          # Diagnose why Cargo rejects restored build outputs.
          CARGO_LOG: cargo::core::compiler::fingerprint=trace
        run: |
          if [ "${{ matrix.build_type }}" == "release" ]; then
            cargo build --locked --release -vv
          else
            cargo build --locked -vv
          fi

      # Run tests
      - name: Test
        shell: bash
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=trace
        run: |
          if [ "${{ matrix.build_type }}" == "release" ]; then
            cargo test --locked --release -vv
          else
            cargo test --locked -vv
          fi

      # Upload artifacts after build and tests succeed
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UnchainedPlugin-${{matrix.build_type}}
          path: |
            target/${{ matrix.build_type }}/UnchainedPlugin.dll
          if-no-files-found: error
