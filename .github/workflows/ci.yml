name: Rust CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Chiv2-Community/zero-infra-mod-registry/actions/validate-metadata@v1
        with:
          plugin_file: plugin.json

  build:
    runs-on: windows-2022
    strategy:
      matrix:
        build_type: [debug, release]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Separate profiles, including fallback restores; share release builds with release.yml.
          # The Rust cache also keys on the toolchain, environment, and dependencies.
          cache-shared-key: windows-${{ matrix.build_type }}

      # Build the project
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.build_type }}" == "release" ]; then
            cargo build --locked --release
          else
            cargo build --locked
          fi

      # Run tests
      - name: Test
        shell: bash
        run: |
          if [ "${{ matrix.build_type }}" == "release" ]; then
            cargo test --locked --release
          else
            cargo test --locked
          fi

      # Upload artifacts after build and tests succeed
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UnchainedPlugin-${{matrix.build_type}}
          path: |
            target/${{ matrix.build_type }}/UnchainedPlugin.dll
          if-no-files-found: error
