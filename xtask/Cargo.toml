[package]
name = "xtask"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
fs_extra = "1.3"
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.19"
proc-macro2 = { version = "1", features = ["span-locations"] }

[[bin]]
name = "fmt-macros"
path = "../build/macro-format.rs"
