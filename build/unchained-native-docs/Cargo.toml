[package]
name = "unchained-native-docs"
version = "0.1.0"
edition = "2021"
build = "../../build.rs"

[build-dependencies]
unchained-build-plan.workspace = true

[dependencies]
anyhow = "1"
memchr = "2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"
tree-sitter = "0.24"
tree-sitter-cpp = "0.23"
url = "2"

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
