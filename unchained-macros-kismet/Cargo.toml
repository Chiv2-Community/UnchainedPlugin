[package]
name = "unchained-macros-kismet"
version = "0.1.0"
edition = "2021"

[dependencies]
unchained-macros-core = { path = "../unchained-macros-core" }
unchained-macros-kismet-impl = { path = "impl" }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52.0", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
inventory = "0.3.14"
retour = { version = "=0.4.0-alpha.4" }
test-case = { workspace = true }
