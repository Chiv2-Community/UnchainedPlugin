[package]
name = "unchained-macros-kismet-impl"
version = "0.1.0"
edition = "2021"
build = "../../build/build.rs"

[package.metadata]
pre-build-steps = ["format"]

[build-dependencies]
unchained-build-plan.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full"] }
