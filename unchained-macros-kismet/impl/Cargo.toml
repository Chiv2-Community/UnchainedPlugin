[package]
name = "unchained-macros-kismet-impl"
version = "0.1.0"
edition = "2021"
build = "../../build/build.rs"

[package.metadata]
pre-build-steps = ["format"]

[build-dependencies]
unchained-build-plan.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
