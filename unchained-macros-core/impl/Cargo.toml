[package]
name = "unchained-macros-core-impl"
version = "0.1.0"
edition = "2021"
build = "../../build/build.rs"

[package.metadata]
pre-build-steps = ["format"]

[build-dependencies]
unchained-build-plan.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "fold", "visit-mut"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
test-case = "3.3"
