openapi: 3.0.0
x-max-json-body-bytes: 1048576
x-max-json-depth: 64
x-json-body-timeout-seconds: 10
info:
  title: Server Browser API
  version: 1.0.0
paths:
  /api/v1/auth/jwks.json:
    get:
      operationId: jwks
      tags: [ApiV1]
      summary: Get public verification keys for Discord join tickets
      description: Empty while Discord signing is unconfigured. Never contains private key material.
      responses:
        default: &ApiError
          description: API error; JSON request bodies exceeding x-max-json-body-bytes return 413. Uploads exceeding x-json-body-timeout-seconds return 408. Nesting beyond x-max-json-depth or invalid Unicode returns 400. Debug deployments may include an additional stack trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '200':
          description: Successful operation
          headers:
            Cache-Control:
              description: Key publication must not be retained by intermediary caches.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [ApiV1]
      summary: Retired EOS token exchange
      deprecated: true
      description: EOS authentication has been removed. This endpoint returns 410 and never validates or exchanges credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        default: *ApiError
        '410':
          description: EOS authentication has been retired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /api/v1/swagger.yaml:
    get:
      operationId: send_swagger
      tags: [ApiV1]
      summary: Get the swagger documentation
      responses:
        default: *ApiError
        '200':
          description: Successful operation
          content:
            text/yaml:
              schema:
                type: string
  /api/v1/servers:
    get:
      operationId: get_servers
      tags: [ApiV1]
      summary: Get a list of registered game servers.
      responses:
        default: *ApiError
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerListResponse'
    post:
      operationId: register
      tags: [ApiV1]
      summary: Register a game server
      description: Bounded by global and source-IP registration quotas; capacity rejection does not evict existing registrations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerRegistrationRequest'
      responses:
        default: *ApiError
        '400':
          description: Invalid registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '429':
          description: Global or source-IP registration capacity exhausted. Retry after registrations expire or are deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
  /api/v1/servers/{server_id}:
    put:
      operationId: update
      tags: [ApiV1]
      summary: Update the listing for a game server. This does not count as a heartbeat
      parameters:
        - in: header
          name: X-CHIV2-SERVER-BROWSER-KEY
          description: The key provided at registration time
          required: true
          schema:
            type: string
        - in: path
          name: server_id
          description: The unique id of the server being updated
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRegisteredServer'
      responses:
        '401':
          description: Registration invalidated after the requester IP changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        default: *ApiError
        '400':
          description: Something in your request is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '403':
          description: You did something you're not allowed to do with the parameters provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          description: Server not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResponse'
    delete:
      operationId: delete_server
      tags: [ApiV1]
      summary: Remove the listing for a game server.
      parameters:
        - in: header
          name: X-CHIV2-SERVER-BROWSER-KEY
          description: The key provided at registration time
          required: true
          schema:
            type: string
        - in: path
          name: server_id
          description: The unique id of the server being updated
          required: true
          schema:
            type: string
      responses:
        default: *ApiError
        '400':
          description: Something in your request is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          description: Server not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '403':
          description: Invalid key provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /api/v1/servers/{server_id}/heartbeat:
    post:
      operationId: heartbeat
      tags: [ApiV1]
      summary: Send a keepalive signal to stay on the server list
      parameters:
        - in: header
          name: X-CHIV2-SERVER-BROWSER-KEY
          description: The key provided at registration time
          required: true
          schema:
            type: string
        - in: path
          name: server_id
          description: The unique id of the server being updated
          schema:
            type: string
          required: true
      responses:
        '401':
          description: Registration invalidated after the requester IP changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        default: *ApiError
        '400':
          description: Something in your request is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '403':
          description: You did something you're not allowed to do with the parameters provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          description: Server not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResponse'
  /api/v1/check-banned/{ip}:
    get:
      operationId: check_banned
      tags: [ApiV1]
      summary: Check if an IP address is banned
      parameters:
        - in: path
          name: ip
          description: The IP address to check
          required: true
          schema:
            type: string
            format: ip-address
      responses:
        default: *ApiError
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanStatusResponse'
  /api/v1/admin/ban-list:
    get:
      operationId: get_ban_list
      tags: [ApiV1]
      summary: Get the list of banned IP addresses
      parameters:
        - in: header
          name: X-CHIV2-SERVER-BROWSER-ADMIN-KEY
          description: The admin key
          required: true
          schema:
            type: string
      responses:
        default: *ApiError
        '403':
          description: Invalid admin key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanListResponse'
    put:
      operationId: add_to_ban_list
      tags: [ApiV1]
      summary: Add IP addresses to the ban list
      parameters:
        - in: header
          name: X-CHIV2-SERVER-BROWSER-ADMIN-KEY
          description: The admin key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpListRequest'
      responses:
        default: *ApiError
        '400':
          description: Invalid IP address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '403':
          description: Invalid admin key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanListResponse'
    delete:
      operationId: remove_from_ban_list
      tags: [ApiV1]
      summary: Remove IP addresses from the ban list
      parameters:
        - in: header
          name: X-CHIV2-SERVER-BROWSER-ADMIN-KEY
          description: The admin key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpListRequest'
      responses:
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        default: *ApiError
        '403':
          description: Invalid admin key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanListResponse'
  /api/v1/admin/verified-list:
    get:
      operationId: get_verified_list
      tags: [ApiV1]
      summary: Get the list of verified IP addresses
      parameters:
        - in: header
          name: X-CHIV2-SERVER-BROWSER-ADMIN-KEY
          description: The admin key
          required: true
          schema:
            type: string
      responses:
        default: *ApiError
        '403':
          description: Invalid admin key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedListResponse'
    put:
      operationId: add_to_verified_list
      tags: [ApiV1]
      summary: Add IP addresses to the verified list
      description: Listings and update responses reflect the current verified policy for existing registrations as well as new ones.
      parameters:
        - in: header
          name: X-CHIV2-SERVER-BROWSER-ADMIN-KEY
          description: The admin key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpListRequest'
      responses:
        default: *ApiError
        '400':
          description: Invalid IP address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '403':
          description: Invalid admin key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedListResponse'
    delete:
      operationId: remove_from_verified_list
      tags: [ApiV1]
      summary: Remove IP addresses from the verified list
      description: Revokes verified/official status in subsequent listings and update responses without requiring re-registration.
      parameters:
        - in: header
          name: X-CHIV2-SERVER-BROWSER-ADMIN-KEY
          description: The admin key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpListRequest'
      responses:
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        default: *ApiError
        '403':
          description: Invalid admin key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedListResponse'
  /api/tbio/GetCurrentGames:
    post:
      operationId: tbio_get_servers
      tags: [Chiv2Compat]
      summary: Get a list of servers in Chivalry 2 format
      responses:
        default: *ApiError
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbioServerListResponse'
  /api/tbio/GetMotd:
    post:
      operationId: get_motd
      tags: [Chiv2Compat]
      summary: Get the Message of the Day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotdRequest'
      responses:
        default: *ApiError
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TbioMotdResponse'
  /api/playfab/Client/Matchmake:
    post:
      operationId: playfab_client_matchmake
      tags: [Chiv2Compat]
      summary: Matchmake a client to a server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchmakeRequest'
      responses:
        default: *ApiError
        '400':
          description: Missing or invalid JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          description: Lobby does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayfabErrorResponse'
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayfabMatchmakeResponse'
components:
  schemas:
    TbioServerListResponse:
      type: object
      required: [Success, Data]
      properties:
        Success:
          type: boolean
        Data:
          $ref: '#/components/schemas/TbioServerListData'
    TbioServerListData:
      type: object
      required: [GameCount, PlayerCount, Games]
      properties:
        GameCount:
          type: integer
        PlayerCount:
          type: integer
        Games:
          type: array
          items:
            $ref: '#/components/schemas/TbioGame'
    TbioGame:
      type: object
      required: [Region, LobbyId, MaxPlayers, Official, BuildVersion, GameMode, PlayerUserIds, RunTime, GameServerState, Tags, LastHeartbeat, ServerHostname, ServerIPV4Address, ServerPort]
      properties:
        Region:
          type: string
        LobbyId:
          type: string
        MaxPlayers:
          type: integer
        Official:
          type: boolean
        BuildVersion:
          type: string
        GameMode:
          type: string
        PlayerUserIds:
          type: array
          items:
            type: integer
        RunTime:
          type: integer
        GameServerState:
          type: integer
        Tags:
          $ref: '#/components/schemas/TbioTags'
        LastHeartbeat:
          type: integer
        ServerHostname:
          type: string
          format: legacy-ip-address
        ServerIPV4Address:
          type: string
          format: legacy-ip-address
        ServerPort:
          type: integer
    TbioTags:
      type: object
      required: [BuildId_s, ServerName_s, Region_s, OFFICIAL_b, Platform_s, FFA_b, MS_i, MapName_s, PingPort_i, QueryPort_i, T0_c, pp_b, t1_c, MTIM_i]
      properties:
        BuildId_s:
          type: string
        ServerName_s:
          type: string
        Region_s:
          type: string
        OFFICIAL_b:
          type: string
        Platform_s:
          type: string
        FFA_b:
          type: string
        MS_i:
          type: string
        MapName_s:
          type: string
        PingPort_i:
          type: string
        QueryPort_i:
          type: string
        T0_c:
          type: string
        pp_b:
          type: string
        t1_c:
          type: string
        MTIM_i:
          type: string
    TbioMotdResponse:
      type: object
      required: [Success, Data, expiration]
      properties:
        Success:
          type: boolean
        Data:
          type: object
          additionalProperties: true
        expiration:
          type: integer
    PlayfabMatchmakeResponse:
      type: object
      required: [code, status, data]
      properties:
        code:
          type: integer
        status:
          type: string
        data:
          $ref: '#/components/schemas/PlayfabGame'
    PlayfabGame:
      type: object
      required: [ServerHostname, ServerIPV4Address, ServerPort, Ticket]
      properties:
        ServerHostname:
          type: string
          format: ip-address
        ServerIPV4Address:
          type: string
          format: ip-address
        ServerPort:
          type: integer
        Ticket:
          type: string
    PlayfabErrorResponse:
      type: object
      required: [code, data, message, params, success]
      properties:
        code:
          type: integer
        data:
          type: object
          additionalProperties: true
        message:
          type: string
        params:
          type: object
          additionalProperties: true
        success:
          type: boolean
    UpdateRegisteredServer:
      type: object
      required:
        - current_map
        - player_count
        - max_players
      properties:
        player_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 1024
          description: The number of players currently on the server
        max_players:
          type: integer
          format: int32
          minimum: 0
          maximum: 1024
          description: The max number of players the server allows
        current_map:
          type: string
          maxLength: 256
          description: The current map being played on the server
        mods:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Mod'
    Mod:
      type: object
      required:
        - name
        - organization
        - version
      properties:
        name:
          type: string
          maxLength: 128
          description: The name of the mod
        organization:
          type: string
          maxLength: 128
          description: The organization that provides the mod
        version:
          type: string
          maxLength: 64
          description: The version of the mod
        active:
          type: boolean
          description: Whether the mod is active on the server
          default: false
    ServerListResponse:
      type: object
      required:
        - servers
      properties:
        servers:
          type: array
          items:
            $ref: '#/components/schemas/ServerListingItem'
          description: A list of servers
    ServerListingItem:
      anyOf:
        - $ref: '#/components/schemas/ServerResponse'
        - $ref: '#/components/schemas/ServerResponseWithIP'
    ServerResponse:
      type: object
      required:
        - unique_id
        - ports
        - name
        - description
        - current_map
        - player_count
        - max_players
        - mods
        - password_protected
        - is_verified
        - last_heartbeat
      properties:
        unique_id:
          type: string
          description: The unique identifier of this server
        ports:
          $ref: '#/components/schemas/Chivalry2Ports'
        password_protected:
          type: boolean
          description: Whether the server is password protected
        is_verified:
          type: boolean
          description: Whether the server is verified
        name:
          type: string
          description: The name of the server
        description:
          type: string
          description: A description of the server
        current_map:
          type: string
          description: The current map being played on the server
        player_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 1024
          description: The number of players currently on the server
        max_players:
          type: integer
          format: int32
          minimum: 0
          maximum: 1024
          description: The max number of players on the server
        mods:
          type: array
          items:
            $ref: '#/components/schemas/Mod'
          description: A list of mods running on the server
        last_heartbeat:
          type: number
          format: double
          description: Unix timestamp of the last heartbeat
    ServerResponseWithIP:
      x-python-parent:
        name: ServerResponse
        module: server_response
      allOf:
        - $ref: '#/components/schemas/ServerResponse'
        - type: object
          required:
            - ip_address
            - local_ip_address
          properties:
            ip_address:
              type: string
              format: ip-address
              description: Observed registration source; included when diagnostics are enabled
            local_ip_address:
              type: string
              format: ip-address
              nullable: true
              description: Advertised address; null if no address is registered
    ServerRegistrationRequest:
      type: object
      required:
        - ports
        - name
        - description
        - current_map
        - player_count
        - max_players
      properties:
        ports:
          $ref: '#/components/schemas/Chivalry2Ports'
        name:
          type: string
          maxLength: 256
          description: The name of the server
        description:
          type: string
          maxLength: 4096
          description: A description of the server
        current_map:
          type: string
          maxLength: 256
          description: The current map being played on the server
        player_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 1024
          description: The number of players currently on the server
        max_players:
          type: integer
          format: int32
          minimum: 0
          maximum: 1024
          description: The max number of players on the server
        password_protected:
          type: boolean
          default: false
          description: Whether the server is password protected
        mods:
          type: array
          maxItems: 64
          default: []
          items:
            $ref: '#/components/schemas/Mod'
          description: A list of mods running on the server
        local_ip_address:
          type: string
          format: ip-address
          description: The local IP address of the server
    RegistrationResponse:
      type: object
      required:
        - key
        - refresh_before
        - server
      properties:
        key:
          type: string
          description: To be used as the X-CHIV2-SERVER-BROWSER-KEY header
        refresh_before:
          type: number
          format: double
          description: Unix timestamp for when the server should refresh its registration. Only present if operation was successful
        server:
          $ref: '#/components/schemas/ServerResponse'
    UpdateResponse:
      type: object
      required:
        - refresh_before
        - server
      properties:
        refresh_before:
          type: number
          format: double
          description: Unix timestamp for when the server should refresh its registration. Only present if operation was successful
        server:
          $ref: '#/components/schemas/ServerResponse'
    Chivalry2Ports:
      type: object
      required:
        - game
        - a2s
        - ping
      properties:
        game:
          type: integer
          format: int32
          description: The port number the server is running on
        a2s:
          type: integer
          format: int32
          description: The port number the server is responding to a2s requests at
        ping:
          type: integer
          format: int32
          description: The port number the server is accepting ping requests at
    StatusResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          description: The status code
        message:
          type: string
          description: A human readable message about the status
        context:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional context for the status
    BanStatusResponse:
      type: object
      required:
        - banned
      properties:
        banned:
          type: boolean
          description: Whether the IP is banned
    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          description: The status code
        message:
          type: string
          description: A human readable message about the error
        stack:
          type: string
          nullable: true
          description: Optional stack trace
    BanListResponse:
      type: object
      required:
        - banned_ips
      properties:
        banned_ips:
          type: array
          items:
            type: string
    VerifiedListResponse:
      type: object
      required:
        - verified_ips
      properties:
        verified_ips:
          type: array
          items:
            type: string
    IpListRequest:
      type: object
      properties:
        banned_ips:
          type: array
          items:
            type: string
        verified_ips:
          type: array
          items:
            type: string
    MotdRequest:
      type: object
      properties:
        Language:
          type: string
          description: Alphanumeric locale selector; values longer than 32 characters or containing non-alphanumeric characters fall back to English.
          default: en
    MatchmakeRequest:
      type: object
      required: [LobbyId]
      properties:
        LobbyId:
          type: string
    LoginRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: The EOS ID token
    Jwk:
      type: object
      required:
        - kty
        - alg
        - use
        - kid
        - n
        - e
      properties:
        kty:
          type: string
        alg:
          type: string
        use:
          type: string
        kid:
          type: string
        n:
          type: string
        e:
          type: string
    JwksResponse:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'
    JoinTicketClaims:
      description: Signed Discord identity for one live server registration. Not an OAuth or refresh credential.
      type: object
      required: [iss, sub, aud, purpose, auth_time, iat, nbf, exp, jti]
      properties:
        iss:
          type: string
          description: Fixed configured HTTPS issuer, compared exactly by validators.
        sub:
          type: string
          description: Verified Discord snowflake as a decimal string, not an engine/platform ID.
        aud:
          type: string
          description: urn:unchained:server:<registration UUID>
        purpose:
          type: string
          enum: [unchained.join]
        auth_time:
          type: integer
          format: int64
          description: Original Discord authentication time; refresh never advances it.
        iat:
          type: integer
          format: int64
        nbf:
          type: integer
          format: int64
        exp:
          type: integer
          format: int64
          description: At most 60 seconds after issuance.
        jti:
          type: string
          description: Single-use random UUID, consumed atomically by the game server.
